<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#241f19" />
    <title>Redirecting…</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1a1612;
      }
    </style>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
      // GitHub Pages serves this file for any path it can't find (e.g. /project/flow,
      // which has no physical file). We re-encode the requested path into a query string
      // and redirect to the app root, which does exist. The companion snippet in
      // index.html restores the real URL before React Router boots, so a cold visit to a
      // deep link (shared link, refresh, search result) lands on the right page instead
      // of a dead end. Genuinely-unknown paths fall through to the in-app NotFound route.
      var pathSegmentsToKeep = 0; // custom domain served from the root
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
